name: Verify and build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnostic:
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      matrix:
        version: ['24.10.7', '25.12.5']
    steps:
      - uses: actions/checkout@v7
      - name: Check first SDK chunks
        env:
          VERSION: ${{ matrix.version }}
        run: timeout -k 5 90 sh .github/scripts/download-sdk.sh "$VERSION" /tmp/sdk-cache || true
  tests:
    if: ${{ !inputs.diagnose }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        series: ['24.10', '25.12']
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 libjson-c-dev
      - run: sh scripts/testNative.sh '${{ matrix.series }}'
      - run: node scripts/checkSource.mjs
      - run: node tests/actionsUiTest.mjs
      - run: python3 tests/ipv6Test.py
      - run: python3 tests/installerTest.py
      - run: git diff --check
  packages:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53-24.10.7
            format: ipk
            series: '24.10'
          - arch: aarch64_cortex-a53-25.12.5
            format: apk
            series: '25.12'
    steps:
      - uses: actions/checkout@v7
      - name: Check out OpenWrt SDK action
        uses: actions/checkout@v7
        with:
          repository: openwrt/gh-action-sdk
          ref: 7fc2640243284ecc44f4a9c3f749a61746ee02cb
          path: .build/sdk-action
      - run: mkdir -p .build/sdk-output
      - name: Build native OpenWrt package
        env:
          ARCH: ${{ matrix.arch }}
          CONTAINER: ghcr.io/openwrt/sdk
          FEEDNAME: sattelite
          PACKAGES: luci-app-podkop-config-auto-updater
          NO_SHFMT_CHECK: 1
          V: s
        run: |
          set -eu
          sudo chown -R 1000:1000 package .build/sdk-output
          docker build --build-arg CONTAINER --build-arg ARCH -t podkop-sdk .build/sdk-action
          sh .github/scripts/download-sdk.sh "${ARCH##*-}" .build/sdk-cache
          docker run --rm --entrypoint cat podkop-sdk /builder/setup.sh > .build/sdk-setup.sh
          sed -i 's@^wget -nv "\$FILE_HOST/\$DOWNLOAD_PATH/\$file_name"$@cp "/sdk-cache/$file_name" "$file_name"@' .build/sdk-setup.sh
          grep -F 'cp "/sdk-cache/$file_name" "$file_name"' .build/sdk-setup.sh
          timeout -k 10 1800 docker run --rm \
            --env FEEDNAME --env PACKAGES --env NO_SHFMT_CHECK --env V \
            --env UPSTREAM_URL=https://downloads.openwrt.org \
            -v "$PWD/.build/sdk-output:/artifacts" -v "$PWD/package:/feed" \
            -v "$PWD/.build/sdk-setup.sh:/builder/setup.sh:ro" -v "$PWD/.build/sdk-cache:/sdk-cache:ro" podkop-sdk
          sudo chown -R "$(id -u):$(id -g)" package .build/sdk-output
      - name: Collect package
        run: |
          mkdir -p dist
          mapfile -t packages < <(find .build/sdk-output -type f -name 'luci-app-podkop-config-auto-updater*.${{ matrix.format }}')
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" 'dist/luci-app-podkop-config-auto-updater-openwrt-${{ matrix.series }}.${{ matrix.format }}'
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: podkop-config-auto-updater-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error
