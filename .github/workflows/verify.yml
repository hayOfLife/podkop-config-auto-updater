name: Verify and build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y --no-install-recommends -o Acquire::Retries=0 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 libjson-c-dev
      - run: sh scripts/testNative.sh
      - run: node scripts/checkSource.mjs
      - run: python3 tests/ipv6Test.py
      - run: python3 tests/installerTest.py
      - run: git diff --check
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64_cortex-a53-24.10.7
            format: ipk
            series: '24.10'
          - arch: aarch64_cortex-a53-25.12.5
            format: apk
            series: '25.12'
    steps:
      - uses: actions/checkout@v7
      - run: mkdir -p .build/sdk-output
      - name: Build native OpenWrt package
        uses: openwrt/gh-action-sdk@7fc2640243284ecc44f4a9c3f749a61746ee02cb
        env:
          ARCH: ${{ matrix.arch }}
          CONTAINER: ghcr.io/openwrt/sdk
          FEEDNAME: sattelite
          FEED_DIR: ${{ github.workspace }}/package
          ARTIFACTS_DIR: ${{ github.workspace }}/.build/sdk-output
          PACKAGES: luci-app-podkop-config-auto-updater
          NO_SHFMT_CHECK: 1
          V: s
      - name: Collect package
        run: |
          mkdir -p dist
          mapfile -t packages < <(find .build/sdk-output -type f -name 'luci-app-podkop-config-auto-updater*.${{ matrix.format }}')
          test "${#packages[@]}" -eq 1
          cp "${packages[0]}" 'dist/luci-app-podkop-config-auto-updater-openwrt-${{ matrix.series }}.${{ matrix.format }}'
          cd dist
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: podkop-config-auto-updater-${{ matrix.format }}
          path: dist/*
          if-no-files-found: error
